<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EMS-OPG — Screen Mockups</title>
<style>
  :root{
    --bg-primary:#1A1D21;
    --bg-panel:#24282E;
    --text-primary:#F2F2F2;
    --text-secondary:#A0A6AD;
    --border:#3A3F46;
    --blue:#2E7CF6;
    --green:#2FB86E;
    --amber:#F5A623;
    --red:#E5484D;
    --disabled:#565C64;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#0E1013;
    font-family:'Segoe UI', Inter, -apple-system, sans-serif;
    color:var(--text-primary);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  .mono{ font-family:'SF Mono', 'Consolas', 'Courier New', monospace; letter-spacing:0.5px; }

  /* --- picker bar --- */
  .picker{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:22px;
    max-width:1040px;
  }
  .picker button{
    background:var(--bg-panel);
    color:var(--text-secondary);
    border:1px solid var(--border);
    padding:9px 16px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
    transition:all .15s ease;
  }
  .picker button:hover{ color:var(--text-primary); border-color:var(--blue); }
  .picker button.active{ background:var(--blue); color:#fff; border-color:var(--blue); }

  .subtitle{
    color:var(--text-secondary);
    font-size:13px;
    margin-bottom:18px;
    text-align:center;
    max-width:600px;
    line-height:1.5;
  }

  /* --- kiosk frame, 1024x600 fixed per Section 8 --- */
  .kiosk{
    width:1024px;
    max-width:100%;
    height:600px;
    background:var(--bg-primary);
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px var(--border);
    position:relative;
  }

  /* --- header --- */
  .header{
    height:60px;
    min-height:60px;
    background:var(--bg-panel);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
  }
  .station-id{ font-size:13px; color:var(--text-secondary); }
  .station-id span{ color:var(--text-primary); font-weight:600; }
  .step-indicator{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .step-dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--disabled);
  }
  .step-dot.done{ background:var(--green); }
  .step-dot.current{ background:var(--blue); box-shadow:0 0 0 3px rgba(46,124,246,0.25); }
  .step-label{ font-size:14px; font-weight:600; margin-left:6px; }
  .home-icon{
    width:34px; height:34px;
    border-radius:6px;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-secondary);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:16px;
  }
  .home-icon:hover{ border-color:var(--blue); color:var(--text-primary); }

  /* --- content --- */
  .content{
    flex:1;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 40px;
    overflow:hidden;
  }

  /* --- footer --- */
  .footer{
    height:70px;
    min-height:70px;
    background:var(--bg-panel);
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
  }
  .btn{
    height:50px;
    padding:0 28px;
    border-radius:6px;
    font-size:16px;
    font-weight:600;
    border:none;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-primary:disabled{ background:var(--disabled); color:#9aa0a6; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--text-secondary); border:1px solid var(--border); }
  .btn-danger{ background:var(--red); color:#fff; }
  .btn-secondary{ background:transparent; color:var(--text-secondary); border:1px solid var(--border); font-weight:500; height:44px; font-size:13px; padding:0 18px; }

  /* --- shared elements --- */
  .screen-title{ font-size:26px; font-weight:700; margin:0 0 6px; }
  .screen-sub{ font-size:14px; color:var(--text-secondary); margin:0 0 26px; text-align:center; }

  .input-field{
    width:460px;
    max-width:100%;
    height:56px;
    background:var(--bg-panel);
    border:2px solid var(--border);
    border-radius:6px;
    color:var(--text-primary);
    font-size:22px;
    padding:0 18px;
    text-align:center;
    outline:none;
  }
  .input-field:focus{ border-color:var(--blue); }
  .input-field.valid{ border-color:var(--green); }
  .input-field.invalid{ border-color:var(--red); }
  .field-hint{ font-size:12px; color:var(--text-secondary); margin-top:10px; }

  .banner{
    position:absolute;
    top:0; left:0; right:0;
    padding:14px 24px;
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:10px;
    z-index:5;
  }
  .banner-error{ background:var(--red); color:#fff; }
  .banner-success{ background:var(--green); color:#0E1013; }
  .banner-amber{ background:var(--amber); color:#241900; }

  /* home screen */
  .home-start{
    width:340px;
    height:120px;
    font-size:24px;
    border-radius:10px;
  }
  .status-chip{
    display:flex; align-items:center; gap:8px;
    color:var(--green); font-size:13px; margin-top:22px;
  }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--green); }

  /* QR screen */
  .qr-box{
    width:320px; height:320px;
    background:#fff;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    padding:18px;
  }
  .qr-caption{ margin-top:20px; font-size:15px; color:var(--text-secondary); text-align:center; }
  .qr-caption b{ color:var(--text-primary); }

  /* finalize table */
  .summary{
    width:520px; max-width:100%;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 22px;
  }
  .summary-row{
    display:flex; justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid var(--border);
    font-size:15px;
  }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row .k{ color:var(--text-secondary); }
  .summary-row .v{ font-weight:600; }

  .home-audit{
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
  }
</style>
</head>
<body>

<div class="picker" id="picker"></div>
<div class="subtitle" id="subtitle">Fixed 1024×600 kiosk frame · colors, type, and spacing pulled directly from Sections 6–10 of the spec.</div>

<div class="kiosk">
  <div class="header">
    <div class="station-id">Station <span>WS-14</span></div>
    <div class="step-indicator" id="stepIndicator"></div>
    <div class="home-icon" title="Home">⌂</div>
  </div>
  <div class="content" id="content"></div>
  <div class="footer" id="footer"></div>
</div>

<script>
const steps = ["Order","Serial","MAC","QR 1/3","QR 2/3","QR 3/3","Finalize"];

function stepIndicatorHTML(currentIndex){
  return steps.map((s,i)=>{
    let cls = i < currentIndex ? "done" : (i===currentIndex ? "current" : "");
    return `<div class="step-dot ${cls}"></div>`;
  }).join("") + `<span class="step-label">${steps[currentIndex] || ""}</span>`;
}

const qrSVG = `<svg viewBox="0 0 29 29" width="260" height="260" shape-rendering="crispEdges">
<rect width="29" height="29" fill="#fff"/>
${(function(){
  // deterministic pseudo-QR pattern, purely illustrative
  let seed=42, cells='';
  function rand(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  for(let y=0;y<29;y++){
    for(let x=0;x<29;x++){
      const inFinder = (x<7&&y<7)||(x>21&&y<7)||(x<7&&y>21);
      let on;
      if(inFinder){
        const lx = x<7?x:(x-22), ly=y<7?y:(y-22);
        on = (lx===0||lx===6||ly===0||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4));
      } else {
        on = rand() > 0.58;
      }
      if(on) cells += `<rect x="${x}" y="${y}" width="1" height="1" fill="#1A1D21"/>`;
    }
  }
  return cells;
})()}
</svg>`;

const screens = {

home: {
  step: -1,
  content: `
    <h1 class="screen-title" style="margin-bottom:2px;">EMS-OPG</h1>
    <p class="screen-sub">Ready to build a device</p>
    <button class="btn btn-primary home-start">Start New Device</button>
    <div class="status-chip"><span class="status-dot"></span> Station idle — backend connected</div>
    <button class="btn btn-secondary home-audit">View Audit History</button>
  `,
  footer: `<div></div><div></div>`
},

order: {
  step: 0,
  content: `
    <h1 class="screen-title">Enter Order Number</h1>
    <p class="screen-sub">Scan or type the order number from the traveler</p>
    <input class="input-field valid mono" value="ORD-48213" readonly>
    <div class="field-hint">✓ Order found — 24 units, Line 3</div>
  `,
  footer: `<button class="btn btn-ghost" disabled>Previous</button><button class="btn btn-primary">Next</button>`
},

serial: {
  step: 1,
  content: `
    <h1 class="screen-title">Enter Serial Number</h1>
    <p class="screen-sub">Scan or type the unit's serial number</p>
    <input class="input-field mono" placeholder="SN-XXXXXXXX" >
    <div class="field-hint">Waiting for input…</div>
  `,
  footer: `<button class="btn btn-ghost">Previous</button><button class="btn btn-primary" disabled>Next</button>`
},

mac: {
  step: 2,
  content: `
    <h1 class="screen-title">Scan First MAC Label</h1>
    <p class="screen-sub">Aim scanner at the MAC address barcode</p>
    <input class="input-field invalid mono" value="00:1B:44:11:3A:B7" readonly>
    <div class="field-hint" style="color:var(--red);">Waiting for rescan…</div>
  `,
  footer: `<button class="btn btn-ghost">Previous</button><button class="btn btn-primary" disabled>Next</button>`,
  banner: `<div class="banner banner-error">⚠ Duplicate MAC address — already assigned to unit SN-20240118. Scan a different label.</div>`
},

qr: {
  step: 4,
  content: `
    <div class="qr-box">${qrSVG}</div>
    <div class="qr-caption">Scan this code to confirm <b>Step 2 of 3</b> — Assembly Verification</div>
  `,
  footer: `<button class="btn btn-ghost" disabled>Previous</button><button class="btn btn-primary" disabled>Waiting for scan…</button>`
},

finalize: {
  step: 6,
  content: `
    <h1 class="screen-title">Finalize Device</h1>
    <div class="summary">
      <div class="summary-row"><span class="k">Order Number</span><span class="v mono">ORD-48213</span></div>
      <div class="summary-row"><span class="k">Serial Number</span><span class="v mono">SN-20240519</span></div>
      <div class="summary-row"><span class="k">MAC 1</span><span class="v mono">00:1B:44:11:3A:B7</span></div>
      <div class="summary-row"><span class="k">MAC 2 (auto)</span><span class="v mono">00:1B:44:11:3A:B8</span></div>
    </div>
  `,
  footer: `<button class="btn btn-ghost">Previous</button><button class="btn btn-primary">Finalize Device</button>`
},

success: {
  step: 6,
  content: `
    <h1 class="screen-title">Device Complete</h1>
    <p class="screen-sub">Record saved — returning to Home…</p>
  `,
  footer: `<div></div><div></div>`,
  banner: `<div class="banner banner-success">✓ Device SN-20240519 finalized successfully</div>`
}
};

const labels = {
  home:"Home", order:"Order Entry", serial:"Serial Entry", mac:"MAC Scan (Error state)",
  qr:"QR Display", finalize:"Finalize", success:"Success"
};

const picker = document.getElementById("picker");
Object.keys(screens).forEach(key=>{
  const b = document.createElement("button");
  b.textContent = labels[key];
  b.onclick = ()=>render(key);
  b.dataset.key = key;
  picker.appendChild(b);
});

function render(key){
  const s = screens[key];
  document.getElementById("content").innerHTML = (s.banner||"") + s.content;
  document.getElementById("footer").innerHTML = s.footer;
  document.getElementById("stepIndicator").innerHTML = s.step >= 0 ? stepIndicatorHTML(s.step) : `<span class="step-label">—</span>`;
  [...picker.children].forEach(b=> b.classList.toggle("active", b.dataset.key===key));
}
render("home");
</script>

</body>
</html>
