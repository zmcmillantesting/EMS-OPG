<section class="phase-panel">
    <div class="panel-header">
        <h1 class="panel-title">Order &amp; Operator</h1>
        <p class="panel-sub">MAC addresses are drawn from this order's pool by quantity — captured first</p>
    </div>

    <div class="card form-grid">
        <div>
            <label class="field-label" for="order-input">Order Number</label>
            <input class="input" id="order-input" type="text" placeholder="123456" autofocus>
        </div>
        <div>
            <label class="field-label" for="operator-input">Operator ID</label>
            <input class="input" id="operator-input" type="text" placeholder="4521">
        </div>
    </div>

    <div class="nav-row">
        <span></span>
        <button id="order-operator-continue" class="button button-primary" type="button">Continue</button>
    </div>
</section>
