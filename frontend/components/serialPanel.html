<section class="phase-panel">
    <div class="panel-header">
        <h1 class="panel-title">Serial Number</h1>
        <p class="panel-sub">Device passed testing — apply and scan the serial label</p>
    </div>

    <div class="card finish-card">
        <div>
            <label class="field-label" for="serial-input">Serial Number</label>
            <input class="input" id="serial-input" type="text" placeholder="EMyyww0000" autofocus>
        </div>
        <p class="scan-hint">Order · <span id="serial-order">—</span></p>
    </div>

    <div class="nav-row">
        <button id="serial-prev" class="button button-secondary" type="button">Previous</button>
        <button id="serial-next" class="button button-primary" type="button">Continue</button>
    </div>
</section>
