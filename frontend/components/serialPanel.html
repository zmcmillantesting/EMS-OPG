<section class="phase-panel">
    <div class="panel-header">
        <h1 class="panel-title">Serial Number</h1>
        <p class="panel-sub">Device passed testing — scan the serial label, then start the next unit</p>
    </div>

    <div class="card finish-card">
        <div>
            <label class="field-label" for="serial-input">Serial Number</label>
            <input class="input" id="serial-input" type="text" placeholder="EMyyyyww0000" autofocus>
        </div>
        <p class="scan-hint">Order · <span id="finish-order">—</span> &nbsp;&middot;&nbsp; MAC 1 · <span id="finish-mac1">—</span> &nbsp;&middot;&nbsp; MAC 2 · <span id="finish-mac2">—</span></p>
    </div>

    <div class="repeat-banner" id="repeat-banner">Device saved to traceability log. Returning to start the next unit &rarr;</div>

    <div class="nav-row">
        <button id="serial-prev" class="button button-secondary" type="button">Previous</button>
        <button id="serial-finish" class="button button-primary" type="button">Save &amp; Repeat</button>
    </div>
</section>
