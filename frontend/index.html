<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS-OPG — Home</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="page page-home">

    <header id="header-placeholder"></header>

    <main class="home-main">
        <section class="home-card card">
            <h1 class="page-title">EMS Operations Production Gateway</h1>
            <p class="page-subtitles">Enter you operator ID and select an order to begin device testing</p>
            <form id="start-test-form" class="start-test-form">
                <div class="form-row">
                    <label class="field-label" for="operator-input">Operator ID</label>
                    <input class="input" id="operator-input" type="text" placeholder="1234" autofocus>
                </div>

                <div class="form-row">
                    <label class="field-label" for="order-input">Order Number</label>
                    <input type="text" class="input" id="order-input" placeholder="e.g. 123456.1">
                </div>

                <button id="start-test" class="button button-primary start-button" type="submit">Start Test</button>
            </form>
        </section>

        <section class="home-grid">
            <a href="history.html" class="button button-secondary home-nav-button">History</a>
            <a href="settings.html" class="button button-secondary home-nav-button">Settings</a>
        </section>

        <section class="home-status card">
            <div class="status-row">
                <span class="status-label">Database</span>
                <span id="home-database-status" class="status-value status-success">Connected</span>
            </div>
            <div class="status-row">
                <span class="status-label">Devices Today</span>
                <span id="home-devices-count" class="status-value">—</span>
            </div>
            <div class="status-row">
                <span class="status-label">Version</span>
                <span id="home-version" class="status-value">1.0.0</span>
            </div>
        </section>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
