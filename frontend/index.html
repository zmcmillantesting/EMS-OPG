<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS-OPG — Home</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="page page-home">

    <header id="header-placeholder"></header>

    <main class="home-main">
        <section class="home-card card">
            <h1 class="page-title">EMS Operations Production Gateway</h1>
            <p class="page-subtitle">Enter your operator ID and select an order to begin device testing</p>
            <form id="start-test-form" class="start-test-form">
                <div class="form-row">
                    <label class="field-label" for="operator-input">Operator ID</label>
                    <input class="input" id="operator-input" type="text" placeholder="4521" autofocus>
                </div>
            
                <div class="form-row">
                    <label class="field-label" for="order-select">Order</label>
                    <div class="input-with-action">
                        <select class="input select-input" id="order-select" required>
                            <option value="">— Select an order —</option>
                        </select>
                        <button id="new-order-toggle" class="button button-secondary" type="button">+ New Order</button>
                    </div>
                </div>

                <div class="form-row">
                    <label class="field-label" for="manage-order-input">Manage Order</label>
                    <div class="input-with-action">
                        <input class="input" id="manage-order-input" type="text" placeholder="Order # — works on completed orders too">
                        <button id="edit-order-button" class="button button-secondary hidden" type="button">Edit Order</button>
                        <button id="delete-order-button" class="button button-danger hidden" type="button">Delete Empty Order</button>
                    </div>
                </div>
            
                <div id="new-order-panel" class="card hidden">
                    <div class="form-row">
                        <label class="field-label" for="new-order-number-input">Order Number</label>
                        <input class="input" id="new-order-number-input" type="text" placeholder="e.g. 12345.6">
                    </div>
                    <div class="form-row">
                        <label class="field-label" for="new-order-quantity-input">Quantity</label>
                        <input class="input" id="new-order-quantity-input" type="number" min="1" placeholder="e.g. 50">
                    </div>
                    <button id="new-order-create" class="button button-primary" type="button">Create Order</button>
                </div>
            
                <button id="start-test" class="button button-primary start-button" type="submit">
                    Start Test
                </button>
            </form>
        </section>

        <section class="home-grid">
            <a href="history.html" class="button button-secondary home-nav-button">History</a>
            <a href="settings.html" class="button button-secondary home-nav-button">Settings</a>
        </section>

        <section class="home-status card">
            <div class="status-row">
                <span class="status-label">Database</span>
                <span id="home-database-status" class="status-value status-success">Connected</span>
            </div>
            <div class="status-row">
                <span class="status-label">Devices Today</span>
                <span id="home-devices-count" class="status-value">—</span>
            </div>
            <div class="status-row">
                <span class="status-label">Version</span>
                <span id="home-version" class="status-value">1.0.0</span>
            </div>
        </section>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
