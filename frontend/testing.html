<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS-OPG — Testing</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/testing.css">
</head>
<body class="page page-testing">

    <header id="header-placeholder"></header>

    <nav class="stage-nav" id="stage-nav" aria-label="Test workflow stages"></nav>

    <div class="reset-device-bar">
        <button id="reset-device-toggle" class="button button-secondary" type="button">Reset Device</button>
    </div>

    <section id="reset-device-panel" class="reset-device-panel card hidden">
        <h2 class="card-title">Reset Device</h2>
        <p class="card-description">Not part of the standard testing process — scan when a device needs to be reset.</p>
        <pre id="reset-device-instructions" class="reset-instructions"></pre>
        <div id="reset-device-steps" class="reset-device-steps"></div>
    </section>

    <main class="testing-main">

        <div id="qr-steps-placeholder" class="phase">
            <section class="workflow-header">
                <h1 id="workflow-name" class="workflow-title">Functional Test</h1>
                <p id="step-indicator" class="step-indicator">Step 1 of 8</p>
            </section>

            <div id="command-panel-placeholder"></div>

            <div id="qr-panel-placeholder"></div>

            <div id="navigation-placeholder"></div>
        </div>

        <div id="mac-placeholder" class="phase"></div>

        <div id="verification-placeholder" class="phase"></div>

        <div id="result-placeholder" class="phase"></div>

        <div id="serial-placeholder" class="phase"></div>

        <div id="mac-placeholder" class="phase"></div>

        <div id="verification-placeholder" class="phase"></div>

    </main>

    <footer id="footer-placeholder"></footer>

    <script src="js/vendor/qrcode.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/testing.js"></script>
</body>
</html>
